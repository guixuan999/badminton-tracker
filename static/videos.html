<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f7">
<title>贵大王的训练视频</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="video.css">
</head>
<body>

<div id="gate" class="wrap gate" style="display:none">
  <div class="card">
    <h2>请输入访问口令</h2>
    <input type="text" id="gate-input" placeholder="ACCESS_CODE" autocomplete="off">
    <div class="note">该口令由服务端环境变量 ACCESS_CODE 设置，输入后保存在本机浏览器。</div>
    <div style="margin-top:10px"><button class="btn-primary" id="gate-ok">进入</button></div>
  </div>
</div>

<div id="app" class="wrap" style="display:none">

  <header class="top">
    <div class="me"><img class="avatar" src="img/boy.png" alt=""><span class="name">贵大王</span></div>
    <h1>训练视频</h1>
  </header>

  <nav class="navrow">
    <a href="./">训练记录</a>
    <a href="videos.html" class="active">训练视频</a>
    <a href="check.html">核对时间</a>
  </nav>

  <div class="card">
    <div class="vmeta">
      <span id="vstats"></span>
      <span class="vacts">
        <button class="btn-mini" id="btn-resync" style="display:none">重认拍摄时间</button>
        <button class="btn-icon" id="btn-shoot" title="拍摄" aria-label="拍摄">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
            <circle cx="12" cy="13" r="4"/>
          </svg>
        </button>
        <button class="btn-icon" id="btn-upload" title="上传" aria-label="上传">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        </button>
        <button class="btn-mini" id="btn-manage">管理</button>
      </span>
    </div>

    <div class="upform" id="up-form" style="display:none">
      <div class="updrop">
        <input type="file" id="up-files" accept="video/*" multiple hidden>
        <button id="up-pick">选择训练视频</button>
        <span class="note">可多选，手机从相册选也行</span>
      </div>

      <div class="upfields">
        <div>
          <label class="field">拍摄日期（留空自动识别）</label>
          <input type="date" id="up-date">
        </div>
        <div>
          <label class="field">画质</label>
          <select id="up-quality">
            <option value="low">省流 480p</option>
            <option value="mid" selected>标准 540p</option>
            <option value="high">清晰 720p</option>
          </select>
        </div>
      </div>
      <div class="upfields one">
        <div>
          <label class="field">备注（选填，这一批统一填）</label>
          <input type="text" id="up-note" placeholder="如 反手发球练习" autocomplete="off">
        </div>
      </div>

      <div class="tipbox" id="up-tip"></div>
      <div class="shotline" id="up-shot" style="display:none"></div>
      <ul class="uplist" id="up-list"></ul>

      <div class="row" style="gap:8px; margin-top:10px">
        <button class="btn-primary" id="btn-up-start" style="flex:1">开始</button>
        <button id="btn-up-cancel">收起</button>
      </div>
    </div>
  </div>

  <div class="tl" id="timeline"></div>
  <div class="empty-tip" id="vempty" style="display:none"></div>

</div>

<div class="player-mask" id="player-mask" style="display:none">
  <div class="player">
    <div class="player-head">
      <div class="player-title" id="player-title"></div>
      <button class="player-close" id="player-close">关闭</button>
    </div>
    <video id="player" controls playsinline preload="metadata"></video>
    <div class="player-foot" id="player-foot"></div>
  </div>
</div>

<div class="cam-mask" id="cam-mask" style="display:none">
  <div class="cam">
    <div class="cam-head">
      <span class="cam-title">拍摄训练视频</span>
      <button class="cam-x" id="cam-close">关闭</button>
    </div>

    <div class="cam-view">
      <video id="cam-preview" autoplay muted playsinline></video>
      <span class="cam-timer" id="cam-timer" style="display:none">00:00</span>
      <div class="cam-hint" id="cam-hint" style="display:none"></div>
    </div>

    <div class="cam-row">
      <select id="cam-quality">
        <option value="low">省流 480p</option>
        <option value="mid" selected>标准 540p</option>
        <option value="high">清晰 720p</option>
      </select>
      <button class="btn-mini cam-flip" id="cam-flip" style="display:none">切换镜头</button>
    </div>

    <div class="cam-zoomrow" id="cam-zoom-row" style="display:none">
      <span class="cam-zoomlab">变焦</span>
      <input type="range" id="cam-zoom" min="1" max="1" step="0.1" value="1">
      <span class="cam-zoomval" id="cam-zoom-val">1.0x</span>
    </div>

    <div class="cam-bar">
      <button class="cam-btn" id="cam-shoot">开始录制</button>
    </div>
    <div class="cam-foot" id="cam-foot"></div>
  </div>
</div>

<div class="mask" id="dialog-mask" style="display:none">
  <div class="dialog">
    <h3 id="dialog-title"></h3>
    <input type="password" id="dialog-input" placeholder="口令" autocomplete="off">
    <div class="dialog-tip" id="dialog-hint" style="display:none"></div>
    <div class="err" id="dialog-err"></div>
    <div class="dialog-actions">
      <button id="dialog-cancel">取消</button>
      <button class="btn-primary" id="dialog-ok">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="videos.js"></script>
</body>
</html>
