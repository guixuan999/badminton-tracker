<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f6f7">
<title>羽毛球培训记录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gate" class="wrap gate" style="display:none">
  <div class="card">
    <h2>请输入访问口令</h2>
    <input type="text" id="gate-input" placeholder="ACCESS_CODE" autocomplete="off">
    <div class="note">该口令由服务端环境变量 ACCESS_CODE 设置，输入后保存在本机浏览器。</div>
    <div style="margin-top:10px"><button class="btn-primary" id="gate-ok">进入</button></div>
  </div>
</div>

<div id="app" class="wrap" style="display:none">

  <header class="top">
    <div class="me"><img class="avatar" src="img/boy.png" alt=""><span class="name">贵大王</span></div>
    <h1>羽毛球培训记录</h1>
  </header>

  <nav class="navrow">
    <a href="./" class="active">训练记录</a>
    <a href="videos.html">视频库</a>
  </nav>

  <div class="card">
    <div class="cal-head" id="range-label"></div>
    <div class="row" style="margin-bottom:10px">
      <button class="chip" data-preset="thisWeek">本周</button>
      <button class="chip" data-preset="lastWeek">上周</button>
      <button class="chip" data-preset="thisMonth">本月</button>
      <button class="chip" data-preset="lastMonth">上月</button>
      <button class="chip" data-preset="custom">自定义</button>
    </div>
    <div class="row" id="custom-range" style="display:none; align-items:flex-end">
      <div style="flex:1"><label class="field">开始</label><input type="date" id="start-date"></div>
      <div style="flex:1"><label class="field">结束</label><input type="date" id="end-date"></div>
    </div>
    <div id="calendar"></div>
  </div>

  <div class="card">
    <button class="btn-primary" id="btn-today-sign">今天报名</button>
    <div class="note" id="today-state"></div>
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k">本范围参训</div><div class="v" id="stat-range">0</div></div>
      <div class="stat"><div class="k">累计参训</div><div class="v" id="stat-total">0</div></div>
      <div class="stat"><div class="k">剩余课时</div><div class="v" id="stat-remain">0</div></div>
    </div>
  </div>

  <div class="card">
    <details id="att-details">
      <summary class="fold">
        <span>参训明细</span>
        <span class="fold-hint" id="att-hint">点击展开</span>
      </summary>
      <div class="row" style="margin:10px 0 8px">
        <button class="chip att-chip" data-att="sinceLastPay">上次缴费以来</button>
        <button class="chip att-chip" data-att="thisWeek">本周</button>
        <button class="chip att-chip" data-att="thisMonth">本月</button>
        <button class="chip att-chip" data-att="lastMonth">上月</button>
        <button class="chip att-chip" data-att="all">全部</button>
        <button class="chip att-chip" data-att="custom">自定义</button>
      </div>
      <div class="row" id="att-custom" style="display:none; align-items:flex-end; margin-bottom:8px">
        <div style="flex:1"><label class="field">开始</label><input type="date" id="att-start"></div>
        <div style="flex:1"><label class="field">结束</label><input type="date" id="att-end"></div>
      </div>
      <div class="note" id="att-range-note"></div>
      <ul class="list" id="attendance-list"></ul>
      <div class="lock-bar" id="lock-bar">
        <span class="lock-state" id="lock-state"></span>
        <span class="lock-actions" id="lock-actions"></span>
      </div>
    </details>
  </div>

  <div class="card">
    <div class="spread">
      <h2 style="margin:0">缴费记录</h2>
      <div class="row" style="gap:6px">
        <button class="btn-mini" id="btn-pay-manage">管理</button>
        <button class="btn-mini" id="btn-pay-toggle">添加</button>
      </div>
    </div>
    <div class="pay-form" id="pay-form" style="display:none; margin-top:12px">
      <div><label class="field">缴费日期</label><input type="date" id="pay-date"></div>
      <div><label class="field">金额（元）</label><input type="number" id="pay-amount" inputmode="decimal" placeholder="2400"></div>
      <div><label class="field">含训练次数</label><input type="number" id="pay-sessions" inputmode="numeric" placeholder="20"></div>
      <div><label class="field">备注</label><input type="text" id="pay-note" placeholder="选填"></div>
      <div class="full row" style="gap:8px">
        <button class="btn-primary" id="btn-pay-add" style="flex:1">保存</button>
        <button id="btn-pay-cancel">取消</button>
      </div>
    </div>
    <ul class="list" id="payment-list"></ul>
    <div class="note" id="pay-manage-tip" style="display:none">管理模式下可删除记录，点「完成」退出。</div>
  </div>

</div>

<div class="mask" id="dialog-mask" style="display:none">
  <div class="dialog">
    <h3 id="dialog-title"></h3>
    <input type="password" id="dialog-input" placeholder="口令" autocomplete="off">
    <div class="dialog-tip" id="dialog-hint" style="display:none"></div>
    <div class="err" id="dialog-err"></div>
    <div class="dialog-actions">
      <button id="dialog-cancel">取消</button>
      <button class="btn-primary" id="dialog-ok">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
