# 羽毛球培训记录 —— nginx 子路径转发片段
#
# 用法：
#   1. 把本文件放到服务器 /etc/nginx/snippets/badminton.conf
#   2. 在博客站点的 server { } 块内任意位置加一行：
#          include /etc/nginx/snippets/badminton.conf;
#      （要加在 HTTPS 的 443 块里；如果 80 端口也直接提供博客服务，80 块里同样加一行）
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 说明：proxy_pass 结尾的斜杠会剥掉 /bm/ 前缀，
#       因此 /bm/api/state 到后端就是 /api/state，后端无需任何改动。
#       要下线就删掉那一行 include，博客配置不受影响。

location = /bm {
    return 301 /bm/;
}

location /bm/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
