# 羽毛球培训记录 —— 独立子域 bm.cypherx.top
#
# 用法：
#   1. 把本文件放到服务器 /etc/nginx/sites-available/badminton
#   2. 建立软链接启用：
#          sudo ln -sf /etc/nginx/sites-available/badminton /etc/nginx/sites-enabled/badminton
#   3. 签发证书：
#          sudo certbot --nginx -d bm.cypherx.top
#   4. sudo nginx -t && sudo systemctl reload nginx
#
# ⚠️ 第 2 步必须排在第 3 步之前。「先建好带 server_name 的块，再签证书」——
#    否则 certbot 找不到匹配的 server 块，会"就近"挑中默认站点，把博客的证书覆盖掉。
#
# 说明：本文件描述的是**子域部署**。proxy_pass 结尾不带斜杠，请求路径原样透传
#       （/api/state 到后端还是 /api/state），后端无需任何改动。
#       前端资源与接口全部使用相对路径，因此挂在根路径、子路径同样能跑。
#
# 下线：删掉 /etc/nginx/sites-enabled/badminton 这个软链接即可，博客配置不受影响。

server {
    listen 80;
    server_name bm.cypherx.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bm.cypherx.top;

    ssl_certificate     /etc/letsencrypt/live/bm.cypherx.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bm.cypherx.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 视频上传：nginx 默认只允许 1MB 请求体，不改这一行所有上传都会被 413 挡下
    client_max_body_size 2048m;
    client_body_timeout 600s;

    # 视频不走 Python，由 nginx 直接读磁盘返回（sendfile 零拷贝，几百 MB 也不吃后端内存）。
    # ⚠️ 前缀必须和部署路径一致：本项目在 /opt/badminton-tracker。
    #    改过目录名的话，这里的 alias 也要跟着改，否则视频全部 404。
    location /media/ {
        alias /opt/badminton-tracker/media/;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=604800";
        # 这里不做口令校验 —— 文件名是 32 位随机十六进制，猜不到；
        # 要更严的话可以加 allow/deny 限定来源 IP，或套一层 auth_basic
    }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 上传时把请求体直接透传给后端，不在 nginx 落地成临时文件
        proxy_request_buffering off;
        # 视频可能长时间暂停在某个分片 / 大文件上传很慢，默认 60s 会中途 504
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
