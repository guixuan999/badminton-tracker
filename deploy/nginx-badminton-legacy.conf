# 羽毛球培训记录 —— 旧路径 /bm/ 的兼容跳转片段
#
# 记录已迁到独立子域 https://bm.cypherx.top/。本片段只负责把老链接 301 过去，
# 让以前分享出去的地址、别的设备上存的书签仍然能用。纯粹是过渡用的，随时可删。
#
# 用法：
#   1. 把本文件放到服务器 /etc/nginx/snippets/badminton.conf
#   2. 在博客站点的 server { } 块内（443 那块）加一行：
#          include /etc/nginx/snippets/badminton.conf;
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# 想彻底让 /bm/ 回归 404：把 include 那行删掉即可，子域不受影响。

location = /bm {
    return 301 https://bm.cypherx.top/;
}

location /bm/ {
    # $is_args$args 用来带上原请求的 query，否则跳转后参数会被截断
    return 301 https://bm.cypherx.top/$is_args$args;
}
